{% extends "base.html" %}
{% block title %}Dashboard - FaceAuth{% endblock %}
{% block content %}
<div class="container">
    <h1>✅ Access Granted</h1>
    <p class="subtitle">Welcome, <strong style="color:#7c83fd;">{{ username }}</strong>! You are authenticated.</p>

    <div style="margin: 24px 0; padding: 20px; background:#0f0f1a; border-radius:10px; border:1px solid #2a2a4a;">
        <p style="font-size:0.85rem; color:#888; margin-bottom:8px;">Logged in as</p>
        <p style="font-size:1.4rem; font-weight:700; color:#5ddb8f;">{{ username }}</p>
        <p style="font-size:0.8rem; color:#666; margin-top:6px;">Face scan authentication successful</p>
    </div>

    <button onclick="logout()" style="background:#3a1a1a; border:1px solid #6a2a2a; color:#f07070;">
        🚪 Logout
    </button>
</div>

<script>
async function logout() {
    await fetch("/api/logout", { method: "POST" });
    location.href = "/";
}
</script>
{% endblock %}
