{% extends "base.html" %}
{% block title %}Login - FaceAuth{% endblock %}
{% block content %}
<div class="container">
    <h1>🔍 Face Scan Login</h1>
    <p class="subtitle">Look at the camera, then click Scan to authenticate.</p>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <button id="scanBtn" disabled>🔎 Scan Face & Login</button>

    <div id="msg" class="msg"></div>
    <div class="links"><a href="/register">No account? Register here</a></div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const scanBtn = document.getElementById("scanBtn");
const msg = document.getElementById("msg");

navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        video.srcObject = stream;
        scanBtn.disabled = false;
    })
    .catch(() => showMsg("Webcam access denied.", "error"));

scanBtn.addEventListener("click", async () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const imageData = canvas.toDataURL("image/jpeg");

    scanBtn.disabled = true;
    scanBtn.textContent = "Scanning...";
    showMsg("Analyzing face...", "info");

    try {
        const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imageData })
        });
        const data = await res.json();
        showMsg(
            data.success
                ? `${data.message} (Confidence: ${data.confidence}%)`
                : data.message,
            data.success ? "success" : "error"
        );
        if (data && data.bbox) {
            const label = data.success ? (data.username || 'User') + ` (${data.confidence}%)` : 'Unknown';
            drawOverlay(data.bbox, label);
        }
        if (data.success) {
            setTimeout(() => location.href = "/dashboard", 1500);
        }
    } catch (e) {
        showMsg("Server error. Is Flask running?", "error");
    }

    scanBtn.disabled = false;
    scanBtn.textContent = "🔎 Scan Face & Login";
});

function showMsg(text, type) {
    msg.textContent = text;
    msg.className = "msg " + type;
}

function drawOverlay(bbox, label) {
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');

    const top = bbox.top; const right = bbox.right; const bottom = bbox.bottom; const left = bbox.left;
    const w = right - left; const h = bottom - top;

    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(canvas, left, top, w, h, 0, 0, w, h);

    ctx.save();
    ctx.filter = 'blur(8px)';
    ctx.drawImage(tmp, left, top, w, h);
    ctx.filter = 'none';
    ctx.restore();

    ctx.strokeStyle = '#39ff14';
    ctx.lineWidth = 4;
    ctx.strokeRect(left + 2, top + 2, Math.max(1, w - 4), Math.max(1, h - 4));

    ctx.font = 'bold 16px Arial';
    const textWidth = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(left, Math.max(0, top - 28), textWidth + 14, 26);
    ctx.fillStyle = '#39ff14';
    ctx.fillText(label, left + 6, Math.max(0, top - 8));
}
</script>
{% endblock %}
