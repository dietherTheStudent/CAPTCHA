<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Face Auth{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #1a1a2e;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #2a2a4a;
        }
        nav .brand { font-weight: 700; font-size: 1.1rem; color: #7c83fd; }
        nav a { color: #aaa; text-decoration: none; font-size: 0.9rem; }
        nav a:hover { color: #7c83fd; }
        .container {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-top: 60px;
        }
        h1 { font-size: 1.6rem; margin-bottom: 8px; color: #fff; }
        p.subtitle { color: #888; font-size: 0.9rem; margin-bottom: 28px; }
        video, canvas {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #2a2a4a;
            background: #000;
        }
        canvas { display: none; }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            background: #0f0f1a;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #7c83fd; }
        button {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: none;
            background: #7c83fd;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }
        button:hover { background: #5a63f5; }
        button:disabled { background: #444; cursor: not-allowed; }
        .msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .msg.success { background: #1a3a2a; border: 1px solid #2a6a4a; color: #5ddb8f; display: block; }
        .msg.error   { background: #3a1a1a; border: 1px solid #6a2a2a; color: #f07070; display: block; }
        .msg.info    { background: #1a2a3a; border: 1px solid #2a4a6a; color: #70b0f0; display: block; }
        .links { margin-top: 20px; font-size: 0.85rem; color: #888; }
        .links a { color: #7c83fd; text-decoration: none; }
    </style>
</head>
<body>
<nav>
    <span class="brand">🔒 FaceAuth</span>
    <a href="/">Home</a>
    <a href="/register">Register</a>
    <a href="/login">Login</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
